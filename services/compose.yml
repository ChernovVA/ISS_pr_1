services:
  ml_service:
    image: car-price-predict-service:2
    build:
      context: ./ml_service
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models:ro

  requests:
    image: car-requests:1
    build:
      context: ./requests
    environment:
      API_URL: http://ml_service:8000/api/prediction
    depends_on:
      - ml_service

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ml_service

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

# Сборка
# sudo docker compose up -d --build

# Логи
# sudo docker compose logs -f